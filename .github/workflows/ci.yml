name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check generated config
        run: npm run check:config

      # docs/PROCESS.md rules: the hook runs check:fast, STATUS.md and plan caps, decisions index, agent models.
      - name: Process rules
        run: npm run check:process

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Unit tests (src/**/*.test.ts, scripts/*.test.*) and e2e tests (tests/e2e/*.test.ts, the real Worker under
      # wrangler dev --local on a temp database): Node's built-in test runner, fetch mocked, no network.
      - name: Worker tests
        run: npm run test:worker

      - name: Build static files
        run: npm run build

      - name: Verify deploy artifacts
        run: |
          for f in out/index.html out/404.html out/sitemap.xml out/robots.txt out/_headers; do
            test -s "$f" || { echo "Missing build artifact: $f"; exit 1; }
          done

  # Accessibility scan (Playwright + axe) of the board as the Worker draws it (`npm run preview`). A required check
  # in the "Protect main" ruleset (see docs/ruleset-protect-main.json), so a red result blocks merge. No `paths:`
  # filter and no job-level `if:`: a skipped required check would block merging, so this job always runs and always
  # reports. The "Did the board change?" step decides whether the slow steps run; when no board file changed they
  # are skipped with a step-level `if:` and the job still ends green. Label `full-audit` forces the audit.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs on the runner's preinstalled Node, before setup-node. Prints board=true or board=false.
      - name: Did the board change?
        id: scope
        run: node scripts/board-changed.mjs >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.board == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.board == 'true'
        run: npm ci

      - name: Build static files
        if: steps.scope.outputs.board == 'true'
        run: npm run build

      - name: Install Chromium
        if: steps.scope.outputs.board == 'true'
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan
        if: steps.scope.outputs.board == 'true'
        run: npm run test:a11y

      - name: Upload Playwright report (failures only)
        if: failure() && steps.scope.outputs.board == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Board unchanged
        if: steps.scope.outputs.board != 'true'
        run: echo "Accessibility audit skipped because no board file changed. Add the label full-audit to force it." >> "$GITHUB_STEP_SUMMARY"

  # Lighthouse CI audit of the board (served by `npm run preview`, wrangler dev --local, so the Worker's own security
  # headers from src/security.ts apply). A required check in the "Protect main" ruleset (see
  # docs/ruleset-protect-main.json), so a red result blocks merge.
  # No `paths:` filter and no job-level `if:`: a skipped required check would block merging, so the job always runs
  # and reports. The "Did the board change?" step decides whether the slow steps run (step-level `if:`); label
  # `full-audit` forces the audit.
  # The `!cancelled()` on the two report steps below keeps the reports on failure too.
  lighthouse:
    runs-on: ubuntu-latest
    # Every board page x 5 runs, about 1 minute per page (17+ pages in run 2): 15 minutes no longer fits.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Runs on the runner's preinstalled Node, before setup-node. Prints board=true or board=false.
      - name: Did the board change?
        id: scope
        run: node scripts/board-changed.mjs >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.board == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.board == 'true'
        run: npm ci

      - name: Build static files
        if: steps.scope.outputs.board == 'true'
        run: npm run build

      # Uses the Google Chrome preinstalled on ubuntu-latest; no browser is downloaded.
      - name: Lighthouse CI
        if: steps.scope.outputs.board == 'true'
        run: npm run test:lighthouse

      - name: Score summary
        if: ${{ !cancelled() && steps.scope.outputs.board == 'true' }}
        run: node scripts/lighthouse-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() && steps.scope.outputs.board == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # The folder name starts with a dot, and upload-artifact skips hidden files unless told otherwise.
          include-hidden-files: true
          retention-days: 14
          # warn, not ignore: a missing report folder (the run stopped early) should show as a warning, not a silent success.
          if-no-files-found: warn

      - name: Board unchanged
        if: steps.scope.outputs.board != 'true'
        run: echo "Lighthouse audit skipped because no board file changed. Add the label full-audit to force it." >> "$GITHUB_STEP_SUMMARY"
